<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="whiteNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="whiteGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(10, 10)">
    <rect width="70" height="70" rx="18" fill="url(#whiteNavy)"/>
    <rect x="3" y="3" width="64" height="64" rx="15" stroke="#F4B942" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Open Book Pages -->
    <path d="M 16 46 C 22 41 30 41 35 44 L 35 27 C 30 24 22 24 16 29 Z" fill="#FFFFFF"/>
    <path d="M 54 46 C 48 41 40 41 35 44 L 35 27 C 40 24 48 24 54 29 Z" fill="#FFFFFF"/>
    <path d="M 35 45 L 35 26" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Base Shelf Curve -->
    <path d="M 14 49 C 22 44 30 45 35 47 C 40 45 48 44 56 49 C 56 50 48 45.5 35 48 C 22 45.5 14 50 14 49 Z" fill="#F4B942"/>

    <!-- Growing Flame of Knowledge -->
    <path d="M 35 13 C 35 13 29 20 31 25 C 33 28 35 29 35 29 C 35 29 37 28 39 25 C 41 20 35 13 35 13 Z" fill="url(#whiteGold)"/>
    <circle cx="35" cy="11.5" r="1.5" fill="#FFF9DB"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(94, 20)">
    <!-- Primary Title -->
    <text x="0" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      SELF STUDY
    </text>
    <text x="146" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F4B942" letter-spacing="0.5">
      LIBRARY
    </text>

    <!-- Accent Underline Divider -->
    <rect x="0" y="36" width="38" height="3" rx="1.5" fill="#F4B942"/>
    <rect x="42" y="37" width="180" height="1" fill="#334155"/>

    <!-- Subtitle -->
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="1.2">
      JALANDHAR BUS STAND • OPEN 24/7
    </text>
  </g>
</svg>

