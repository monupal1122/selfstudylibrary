<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="symNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="symGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E59819"/>
      <stop offset="50%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#102A43" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect width="120" height="120" rx="28" fill="url(#symNavy)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="4" y="4" width="112" height="112" rx="24" stroke="#F4B942" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Open Book Pages (Left & Right) -->
  <!-- Left Page -->
  <path d="M 26 76 C 36 68 48 68 58 72 L 58 44 C 48 40 36 40 26 48 Z" fill="#FFFFFF"/>
  <path d="M 28 72 C 37 66 47 66 56 69" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Page -->
  <path d="M 94 76 C 84 68 72 68 62 72 L 62 44 C 72 40 84 40 94 48 Z" fill="#FFFFFF"/>
  <path d="M 92 72 C 83 66 73 66 64 69" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Center Book Spine Line -->
  <path d="M 60 74 L 60 43" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>

  <!-- Book Base Shelf Curve -->
  <path d="M 22 80 C 36 72 50 73 60 77 C 70 73 84 72 98 80 C 98 81 84 74 60 78 C 36 74 22 81 22 80 Z" fill="#F4B942"/>

  <!-- Upward Growing Knowledge Sprout / Flame of Wisdom -->
  <path d="M 60 22 C 60 22 51 32 54 41 C 56 46 60 48 60 48 C 60 48 64 46 66 41 C 69 32 60 22 60 22 Z" fill="url(#symGold)"/>
  
  <!-- Rising Leaf/Page 1 -->
  <path d="M 60 38 C 55 33 50 34 46 38 C 45 42 49 45 55 43 Z" fill="#FDE68A" opacity="0.9"/>
  <!-- Rising Leaf/Page 2 -->
  <path d="M 60 38 C 65 33 70 34 74 38 C 75 42 71 45 65 43 Z" fill="#FDE68A" opacity="0.9"/>

  <!-- Small Bright Star / Peak Accent -->
  <circle cx="60" cy="20" r="2.5" fill="#FFF9DB"/>
</svg>

