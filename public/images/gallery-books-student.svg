<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g6Bg)"/>

  <!-- Student Focused Revision Setting -->
  <g transform="translate(180, 140)">
    <!-- Main Big Study Stack of Books -->
    <rect x="40" y="240" width="360" height="30" rx="4" fill="#0284C7"/>
    <text x="220" y="260" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">GENERAL STUDIES &amp; CURRENT AFFAIRS</text>
    
    <rect x="60" y="205" width="320" height="32" rx="4" fill="#10B981"/>
    <text x="220" y="226" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">QUANTITATIVE APTITUDE &amp; REASONING</text>
    
    <rect x="90" y="170" width="260" height="32" rx="4" fill="#E11D48"/>
    <text x="220" y="191" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">INDIAN POLITY &amp; CONSTITUTION</text>
    
    <rect x="120" y="135" width="200" height="32" rx="4" fill="#F59E0B"/>
    <text x="220" y="156" font-family="sans-serif" font-size="12" font-weight="700" fill="#102A43" text-anchor="middle">MOCK TEST PAPERS 2025</text>

    <!-- Highlighter & Pen Holder -->
    <rect x="370" y="150" width="45" height="70" rx="8" fill="#334155"/>
    <rect x="380" y="110" width="6" height="40" rx="2" fill="#FACC15"/>
    <rect x="390" y="120" width="6" height="30" rx="2" fill="#38BDF8"/>
    <rect x="400" y="105" width="6" height="45" rx="2" fill="#EC4899"/>
  </g>

  <!-- Motivational Exam Target Badges -->
  <g transform="translate(140, 440)">
    <rect x="0" y="0" width="110" height="40" rx="20" fill="#1E293B" stroke="#F4B942" stroke-width="1.5"/>
    <text x="55" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">UPSC / IAS</text>

    <rect x="130" y="0" width="110" height="40" rx="20" fill="#1E293B" stroke="#F4B942" stroke-width="1.5"/>
    <text x="185" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">PPSC / PCS</text>

    <rect x="260" y="0" width="110" height="40" rx="20" fill="#1E293B" stroke="#F4B942" stroke-width="1.5"/>
    <text x="315" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">BANKING / SSC</text>

    <rect x="390" y="0" width="120" height="40" rx="20" fill="#1E293B" stroke="#F4B942" stroke-width="1.5"/>
    <text x="450" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">IELTS / PTE</text>
  </g>

  <!-- Label -->
  <rect x="40" y="40" width="310" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Competitive Exam Aspirants</text>
</svg>

