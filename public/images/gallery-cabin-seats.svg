<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g3Bg)"/>

  <!-- Close-Up of an Individual Study Cabin -->
  <rect x="150" y="100" width="500" height="420" rx="16" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  <rect x="170" y="120" width="460" height="200" rx="8" fill="#0F172A"/>

  <!-- Power Switchboard with Charging Sockets -->
  <g transform="translate(480, 240)">
    <rect width="110" height="45" rx="6" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <circle cx="25" cy="22" r="6" fill="#94A3B8"/>
    <circle cx="55" cy="22" r="6" fill="#94A3B8"/>
    <rect x="75" y="16" width="18" height="12" rx="2" fill="#38BDF8"/>
    <circle cx="25" cy="22" r="2" fill="#0F172A"/>
    <circle cx="55" cy="22" r="2" fill="#0F172A"/>
  </g>

  <!-- Bookshelf section -->
  <g transform="translate(190, 140)">
    <rect x="0" y="60" width="220" height="10" fill="#334155"/>
    <rect x="10" y="10" width="20" height="50" rx="2" fill="#EF4444"/>
    <rect x="34" y="0" width="22" height="60" rx="2" fill="#F59E0B"/>
    <rect x="60" y="15" width="18" height="45" rx="2" fill="#10B981"/>
    <rect x="82" y="5" width="24" height="55" rx="2" fill="#3B82F6"/>
  </g>

  <!-- Wooden Desk Surface -->
  <rect x="140" y="320" width="520" height="30" rx="6" fill="#D97706" stroke="#92400E" stroke-width="2"/>

  <!-- Ergonomic Mesh Chair Backrest -->
  <rect x="320" y="360" width="160" height="180" rx="20" fill="#102A43" stroke="#1D4ED8" stroke-width="4"/>
  <ellipse cx="400" cy="510" rx="70" ry="20" fill="#0B132B"/>

  <!-- Label -->
  <rect x="40" y="40" width="310" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Private Pod &amp; Charging Sockets</text>
</svg>

