<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="50%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E59819"/>
      <stop offset="50%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle Decorative Circles -->
  <circle cx="1100" cy="100" r="300" fill="#1D4ED8" opacity="0.2"/>
  <circle cx="150" cy="550" r="250" fill="#F4B942" opacity="0.08"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#F4B942" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Left Side: Logo & Information -->
  <g transform="translate(80, 80)">
    <!-- Logo Symbol -->
    <rect width="90" height="90" rx="22" fill="#102A43" stroke="#F4B942" stroke-width="2"/>
    <path d="M 22 58 C 30 52 40 52 45 55 L 45 35 C 40 32 30 32 22 37 Z" fill="#FFFFFF"/>
    <path d="M 68 58 C 60 52 50 52 45 55 L 45 35 C 50 32 60 32 68 37 Z" fill="#FFFFFF"/>
    <path d="M 45 56 L 45 34" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 20 62 C 30 56 40 57 45 59 C 50 57 60 56 70 62 Z" fill="#F4B942"/>
    <path d="M 45 20 C 45 20 38 27 40 32 C 42 35 45 36 45 36 C 45 36 48 35 50 32 C 52 27 45 20 45 20 Z" fill="url(#ogGold)"/>
    <circle cx="45" cy="18" r="2" fill="#FFF9DB"/>

    <!-- 24/7 Pill Badge -->
    <rect x="110" y="25" width="190" height="40" rx="20" fill="#F4B942"/>
    <text x="205" y="50" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#102A43" text-anchor="middle" letter-spacing="1">
      ★ OPEN 24 HOURS
    </text>

    <!-- Main Title -->
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      SELF STUDY LIBRARY
    </text>
    <text x="0" y="215" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#F4B942">
      In Jalandhar • Near Bus Stand
    </text>

    <!-- Subtitle -->
    <text x="0" y="275" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#E2E8F0">
      Your Dedicated Space for Focused Study &amp; Competitive Exam Prep
    </text>
    <text x="0" y="310" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      Gate 3, Bus Stand, Outside Jawahar Nagar, Jalandhar, Punjab 144001
    </text>

    <!-- Feature Highlights -->
    <g transform="translate(0, 350)">
      <rect x="0" y="0" width="220" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="110" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="middle">✓ AC Study Hall</text>

      <rect x="235" y="0" width="220" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="345" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="middle">✓ High-Speed Wi-Fi</text>

      <rect x="470" y="0" width="220" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="580" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="middle">✓ Personal Charging</text>

      <rect x="705" y="0" width="220" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="815" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FDE68A" text-anchor="middle">✓ 24/7 CCTV Safety</text>
    </g>

