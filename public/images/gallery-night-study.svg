<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="lampSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g4Bg)"/>

  <!-- Moon outside window -->
  <rect x="520" y="80" width="180" height="180" rx="12" fill="#0A0F1D" stroke="#334155" stroke-width="2"/>
  <circle cx="610" cy="140" r="28" fill="#FEF08A"/>
  <circle cx="620" cy="135" r="24" fill="#0A0F1D"/>

  <!-- Warm Focused Night Lamp Cone -->
  <circle cx="280" cy="360" r="180" fill="url(#lampSpot)"/>

  <!-- Desk and Books in Focused Spotlight -->
  <rect x="140" y="380" width="350" height="24" rx="4" fill="#B45309"/>
  <!-- Open Book under Warm Glow -->
  <polygon points="220,380 270,365 320,380 320,405 270,390 220,405" fill="#FFFFFF"/>
  <line x1="270" y1="365" x2="270" y2="390" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 24H Neon Glow Sign on Wall -->
  <g transform="translate(140, 100)">
    <rect width="200" height="70" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="100" y="44" font-family="sans-serif" font-size="22" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
      24/7 OPEN
    </text>
  </g>

  <!-- Label -->
  <rect x="40" y="40" width="310" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Silent Night Study Environment</text>
</svg>

