<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g1Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="g1Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g1Bg)"/>
  
  <!-- Row of Study Cabins in Perspective -->
  <polygon points="50,450 750,450 800,600 0,600" fill="#0B132B"/>
  
  <!-- Cubicle 1 -->
  <rect x="60" y="220" width="180" height="230" rx="8" fill="#102A43" stroke="#334155" stroke-width="2"/>
  <rect x="75" y="340" width="150" height="15" fill="#D97706"/>
  <rect x="85" y="270" width="12" height="70" fill="#3B82F6"/>
  <rect x="100" y="280" width="14" height="60" fill="#10B981"/>
  <line x1="170" y1="240" x2="170" y2="290" stroke="#F4B942" stroke-width="3"/>
  <circle cx="170" cy="295" r="8" fill="#FDE68A"/>

  <!-- Cubicle 2 -->
  <rect x="270" y="200" width="220" height="250" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="2"/>
  <rect x="285" y="335" width="190" height="18" fill="#D97706"/>
  <!-- Laptop -->
  <rect x="330" y="280" width="70" height="45" rx="3" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <polygon points="320,325 410,325 420,335 310,335" fill="#64748B"/>
  <!-- Study Lamp -->
  <line x1="430" y1="230" x2="430" y2="280" stroke="#F4B942" stroke-width="3"/>
  <polygon points="415,280 445,280 455,340 405,340" fill="#FDE68A" opacity="0.3"/>

  <!-- Cubicle 3 -->
  <rect x="520" y="220" width="180" height="230" rx="8" fill="#102A43" stroke="#334155" stroke-width="2"/>
  <rect x="535" y="340" width="150" height="15" fill="#D97706"/>
  <rect x="550" y="290" width="50" height="50" fill="#F8FAFC" transform="rotate(-5 575 315)"/>
  <line x1="630" y1="240" x2="630" y2="290" stroke="#F4B942" stroke-width="3"/>
  <circle cx="630" cy="295" r="8" fill="#FDE68A"/>

  <!-- Banner label -->
  <rect x="40" y="40" width="310" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Study Hall • Individual Cabins</text>
</svg>

