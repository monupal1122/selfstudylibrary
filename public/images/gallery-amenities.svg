<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g5Bg)"/>

  <!-- Left: RO Drinking Water Dispenser -->
  <g transform="translate(140, 160)">
    <rect width="180" height="340" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <rect x="25" y="30" width="130" height="90" rx="8" fill="#0284C7"/>
    <text x="90" y="80" font-family="sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">PURE RO WATER</text>
    <!-- Tap dispensing -->
    <rect x="80" y="140" width="20" height="30" rx="4" fill="#64748B"/>
    <circle cx="90" cy="180" r="4" fill="#38BDF8"/>
    <circle cx="90" cy="195" r="4" fill="#38BDF8"/>
    <!-- Water Glass -->
    <polygon points="75,210 105,210 100,240 80,240" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
  </g>

  <!-- Right: High Speed Wi-Fi & CCTV Security Icon Board -->
  <g transform="translate(420, 160)">
    <!-- CCTV Camera -->
    <rect width="240" height="150" rx="16" fill="#102A43" stroke="#334155" stroke-width="2"/>
    <path d="M 60 70 L 120 50 L 120 90 Z" fill="#F4B942"/>
    <rect x="120" y="45" width="80" height="50" rx="8" fill="#F8FAFC"/>
    <circle cx="160" cy="70" r="14" fill="#0F172A"/>
    <circle cx="160" cy="70" r="6" fill="#10B981"/>
    <text x="120" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">24/7 CCTV Security</text>

    <!-- Wi-Fi Router Box -->
    <g transform="translate(0, 180)">
      <rect width="240" height="150" rx="16" fill="#102A43" stroke="#334155" stroke-width="2"/>
      <line x1="70" y1="50" x2="70" y2="20" stroke="#F4B942" stroke-width="4"/>
      <line x1="170" y1="50" x2="170" y2="20" stroke="#F4B942" stroke-width="4"/>
      <rect x="40" y="50" width="160" height="40" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <circle cx="65" cy="70" r="4" fill="#10B981"/>
      <circle cx="85" cy="70" r="4" fill="#10B981"/>
      <circle cx="105" cy="70" r="4" fill="#38BDF8"/>
      <text x="120" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">High-Speed Fiber Wi-Fi</text>
    </g>
  </g>

  <!-- Label -->
  <rect x="40" y="40" width="280" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Amenities &amp; Clean Water</text>
</svg>

