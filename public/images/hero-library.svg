<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bgRoom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#102A43"/>
      <stop offset="100%" stop-color="#0B1B2B"/>
    </linearGradient>
    
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="windowNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="1200" height="800" fill="url(#bgRoom)"/>

  <!-- Subtle Architecture / Wall Paneling -->
  <line x1="200" y1="0" x2="200" y2="520" stroke="#1E293B" stroke-width="2"/>
  <line x1="450" y1="0" x2="450" y2="520" stroke="#1E293B" stroke-width="2"/>
  <line x1="750" y1="0" x2="750" y2="520" stroke="#1E293B" stroke-width="2"/>
  <line x1="1000" y1="0" x2="1000" y2="520" stroke="#1E293B" stroke-width="2"/>

  <!-- High Modern Windows (Night sky outside Jalandhar) -->
  <g opacity="0.6">
    <rect x="120" y="60" width="220" height="300" rx="12" fill="url(#windowNight)" stroke="#334155" stroke-width="3"/>
    <line x1="230" y1="60" x2="230" y2="360" stroke="#334155" stroke-width="3"/>
    <line x1="120" y1="200" x2="340" y2="200" stroke="#334155" stroke-width="3"/>
    <circle cx="160" cy="110" r="1.5" fill="#FFF"/>
    <circle cx="280" cy="140" r="1.5" fill="#FFF"/>
    <circle cx="210" cy="90" r="2" fill="#FDE68A"/>

    <rect x="860" y="60" width="220" height="300" rx="12" fill="url(#windowNight)" stroke="#334155" stroke-width="3"/>
    <line x1="970" y1="60" x2="970" y2="360" stroke="#334155" stroke-width="3"/>
    <line x1="860" y1="200" x2="1080" y2="200" stroke="#334155" stroke-width="3"/>
    <circle cx="920" cy="100" r="1.5" fill="#FFF"/>
    <circle cx="1030" cy="150" r="2" fill="#FDE68A"/>
  </g>

  <!-- Wall Motivational Clock (Indicating 24/7 Productivity) -->
  <g transform="translate(600, 140)">
    <circle cx="0" cy="0" r="54" fill="#0F172A" stroke="#F4B942" stroke-width="3"/>
    <circle cx="0" cy="0" r="48" fill="#1E293B"/>
    <line x1="0" y1="-40" x2="0" y2="-32" stroke="#F4B942" stroke-width="3"/>
    <line x1="40" y1="0" x2="32" y2="0" stroke="#F4B942" stroke-width="3"/>
    <line x1="0" y1="40" x2="0" y2="32" stroke="#F4B942" stroke-width="3"/>
    <line x1="-40" y1="0" x2="-32" y2="0" stroke="#F4B942" stroke-width="3"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="16" y2="-22" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-12" y2="8" stroke="#F4B942" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#F4B942"/>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#94A3B8" letter-spacing="1">24 HOURS</text>
  </g>

  <!-- Air Conditioner Unit on Wall -->
  <g transform="translate(490, 40)">
    <rect width="220" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="20" y1="36" x2="200" y2="36" stroke="#94A3B8" stroke-width="2"/>
    <!-- LED indicator -->
    <circle cx="195" cy="18" r="3" fill="#10B981"/>
    <!-- Cool breeze waves -->
    <path d="M 60 52 Q 80 68 100 52 T 140 52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 80 62 Q 100 78 120 62 T 160 62" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Flooring (Polished modern hardwood / granite) -->
  <polygon points="0,520 1200,520 1200,800 0,800" fill="#1E293B"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#334155" stroke-width="4"/>
  <!-- Floor perspective lines -->
  <line x1="100" y1="520" x2="-100" y2="800" stroke="#0F172A" stroke-width="2"/>
  <line x1="400" y1="520" x2="250" y2="800" stroke="#0F172A" stroke-width="2"/>
  <line x1="800" y1="520" x2="950" y2="800" stroke="#0F172A" stroke-width="2"/>
  <line x1="1100" y1="520" x2="1300" y2="800" stroke="#0F172A" stroke-width="2"/>

  <!-- Left Study Cabin Partition -->
  <g transform="translate(60, 360)">
    <!-- Cabin Back Panel -->
    <rect x="0" y="0" width="320" height="260" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="140" width="320" height="20" rx="3" fill="#334155"/>
    <!-- Bookshelf in cabin -->
    <rect x="30" y="80" width="18" height="60" rx="2" fill="#3B82F6"/>
    <rect x="50" y="70" width="22" height="70" rx="2" fill="#F59E0B"/>
    <rect x="74" y="85" width="16" height="55" rx="2" fill="#10B981"/>
    <rect x="92" y="75" width="20" height="65" rx="2" fill="#EF4444"/>
    <!-- Small Plant -->
    <path d="M 260 140 L 250 110 L 270 110 Z" fill="#D97706"/>
    <circle cx="260" cy="100" r="14" fill="#10B981"/>
    <!-- Study Desk Lamp -->
    <path d="M 210 140 L 210 80 Q 210 60 180 60" stroke="#F4B942" stroke-width="4" fill="none"/>
    <path d="M 160 55 L 190 55 L 180 75 L 170 75 Z" fill="#F4B942"/>
    <!-- Lamp Light Cone -->
    <polygon points="175,75 110,210 240,210" fill="url(#lampGlow)"/>
    <!-- Open Notes & Pen -->
    <rect x="130" y="150" width="70" height="45" rx="3" fill="#FFFFFF" transform="rotate(-5 165 172)"/>
  </g>

  <!-- Center Main Study Desk (Featured Focus) -->
  <g transform="translate(380, 290)">
    <!-- High Private Acoustic Partition -->
    <rect x="0" y="0" width="440" height="340" rx="14" fill="#0B1B2B" stroke="#1E293B" stroke-width="3" filter="url(#softShadow)"/>
    <!-- Inner Acoustic Felt Panel -->
    <rect x="16" y="16" width="408" height="180" rx="8" fill="#1E293B" opacity="0.7"/>

    <!-- Pinboard with Study Goals / Schedule Sticky Notes -->
    <rect x="40" y="36" width="60" height="55" rx="4" fill="#FDE68A" transform="rotate(-3 70 63)"/>
    <text x="50" y="55" font-family="sans-serif" font-size="8" font-weight="700" fill="#B45309">UPSC 2025</text>
    <line x1="50" y1="65" x2="88" y2="65" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="50" y1="73" x2="82" y2="73" stroke="#CBD5E1" stroke-width="1.5"/>

    <rect x="120" y="42" width="65" height="50" rx="4" fill="#A7F3D0" transform="rotate(2 152 67)"/>
    <text x="130" y="60" font-family="sans-serif" font-size="8" font-weight="700" fill="#065F46">MOCK TEST</text>
    <line x1="130" y1="70" x2="172" y2="70" stroke="#99F6E4" stroke-width="1.5"/>

    <!-- Desk Power Strip / Individual Charging Points -->
    <g transform="translate(320, 160)">
      <rect width="80" height="30" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="4" fill="#64748B"/>
      <circle cx="45" cy="15" r="4" fill="#64748B"/>
      <rect x="62" y="12" width="8" height="6" rx="1" fill="#38BDF8"/>
      <!-- Green Power LED -->
      <circle cx="76" cy="15" r="1.5" fill="#10B981"/>
    </g>

    <!-- Warm Overhead Study Light Bar -->
    <rect x="60" y="12" width="320" height="10" rx="5" fill="#F4B942"/>
    <polygon points="70,22 0,260 440,260 370,22" fill="url(#lampGlow)" opacity="0.65"/>

    <!-- Spacious Study Desktop -->
    <rect x="-10" y="210" width="460" height="28" rx="6" fill="url(#deskGrad)" stroke="#78350F" stroke-width="2"/>

    <!-- Open Laptop on Desk -->
    <g transform="translate(130, 130)">
      <!-- Screen -->
      <rect x="20" y="15" width="140" height="85" rx="6" fill="#0F172A" stroke="#475569" stroke-width="3"/>
      <!-- Inner Display Screen -->
      <rect x="26" y="21" width="128" height="73" rx="3" fill="#1E293B"/>
      <!-- Video Lecture / Code / Content -->
      <rect x="34" y="29" width="70" height="42" rx="2" fill="#0284C7"/>
      <polygon points="65,45 65,55 75,50" fill="#FFF"/>
      <line x1="112" y1="32" x2="146" y2="32" stroke="#94A3B8" stroke-width="2"/>
      <line x1="112" y1="40" x2="140" y2="40" stroke="#64748B" stroke-width="2"/>
      <line x1="112" y1="48" x2="144" y2="48" stroke="#64748B" stroke-width="2"/>
      <!-- Base & Keyboard -->
      <polygon points="10,100 170,100 185,112 -5,112" fill="#64748B"/>
      <rect x="65" y="104" width="50" height="5" rx="1.5" fill="#94A3B8"/>
    </g>

    <!-- Notebook, Stationery, Coffee/Water Mug -->
    <rect x="40" y="215" width="75" height="50" rx="4" fill="#FFFFFF" transform="rotate(-6 77 240)"/>
    <line x1="50" y1="225" x2="95" y2="220" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="50" y1="235" x2="105" y2="230" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="50" y1="245" x2="90" y2="240" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Yellow Highlighter Pen -->
    <rect x="35" y="248" width="50" height="6" rx="2" fill="#FACC15" transform="rotate(15 60 251)"/>

    <!-- Insulated Water Bottle -->
    <rect x="370" y="170" width="26" height="55" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="375" y="162" width="16" height="8" rx="2" fill="#0369A1"/>
  </g>

  <!-- Ergonomic Study Chair (Foreground) -->
  <g transform="translate(540, 500)">
    <!-- Chair Backrest -->
    <rect x="-65" y="0" width="130" height="150" rx="24" fill="#102A43" stroke="#1D4ED8" stroke-width="4" filter="url(#softShadow)"/>
    <!-- Lumbar Support Cushion -->
    <rect x="-45" y="70" width="90" height="35" rx="10" fill="#1E293B"/>
    <!-- Headrest -->
    <rect x="-35" y="-35" width="70" height="30" rx="12" fill="#102A43" stroke="#1D4ED8" stroke-width="3"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#475569" stroke-width="6"/>
    <!-- Armrests -->
    <rect x="-85" y="60" width="20" height="60" rx="6" fill="#334155"/>
    <rect x="65" y="60" width="20" height="60" rx="6" fill="#334155"/>
    <!-- Seat Cushion -->
    <ellipse cx="0" cy="155" rx="75" ry="24" fill="#0B1B2B" stroke="#1D4ED8" stroke-width="3"/>
    <!-- Hydraulic Stem & Star Base -->
    <line x1="0" y1="175" x2="0" y2="225" stroke="#475569" stroke-width="14"/>
    <line x1="0" y1="225" x2="-80" y2="255" stroke="#334155" stroke-width="8"/>
    <line x1="0" y1="225" x2="80" y2="255" stroke="#334155" stroke-width="8"/>
    <circle cx="-80" cy="255" r="8" fill="#0F172A"/>
    <circle cx="80" cy="255" r="8" fill="#0F172A"/>
  </g>

  <!-- Right Study Cabin Partition -->
  <g transform="translate(840, 360)">
    <rect x="0" y="0" width="300" height="260" rx="8" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="140" width="300" height="20" rx="3" fill="#334155"/>
    <!-- Stack of Textbooks -->
    <rect x="25" y="115" width="90" height="12" rx="2" fill="#DC2626"/>
    <rect x="30" y="102" width="80" height="12" rx="2" fill="#2563EB"/>
    <rect x="35" y="90" width="70" height="11" rx="2" fill="#F59E0B"/>
    <!-- Lamp -->
    <path d="M 230 140 L 230 80 Q 230 60 200 60" stroke="#F4B942" stroke-width="4" fill="none"/>
    <path d="M 180 55 L 210 55 L 200 75 L 190 75 Z" fill="#F4B942"/>
    <polygon points="195,75 140,210 260,210" fill="url(#lampGlow)" opacity="0.6"/>
  </g>

  <!-- Prominent Floating Trust Badge in Corner: "OPEN 24 HOURS • JALANDHAR BUS STAND" -->
  <g transform="translate(900, 480)" filter="url(#softShadow)">
    <rect width="240" height="90" rx="16" fill="#102A43" stroke="#F4B942" stroke-width="2"/>
    <circle cx="40" cy="45" r="22" fill="url(#goldBadge)"/>
    <!-- Clock icon inside gold circle -->
    <path d="M 40 33 L 40 45 L 48 45" stroke="#102A43" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="45" r="14" stroke="#102A43" stroke-width="2.5" fill="none"/>
    
    <text x="76" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">OPEN 24 HOURS</text>
    <text x="76" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F4B942">7 Days A Week</text>
    <text x="76" y="72" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Gate 3, Bus Stand Jalandhar</text>
  </g>
</svg>

