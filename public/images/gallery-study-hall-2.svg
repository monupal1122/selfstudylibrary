<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g2Bg)"/>
  
  <!-- Modern Reading Room Perspective View -->
  <polygon points="100,500 700,500 800,600 0,600" fill="#0B132B"/>
  
  <!-- Overhead Slim Linear Lighting -->
  <rect x="250" y="80" width="300" height="12" rx="4" fill="#F8FAFC"/>
  <polygon points="250,92 100,450 700,450 550,92" fill="#F8FAFC" opacity="0.08"/>

  <!-- AC Units -->
  <rect x="300" y="30" width="200" height="40" rx="6" fill="#F1F5F9"/>
  <line x1="320" y1="58" x2="480" y2="58" stroke="#94A3B8" stroke-width="2"/>

  <!-- Long Study Desk Rows -->
  <rect x="120" y="360" width="560" height="24" rx="4" fill="#D97706"/>
  <!-- Partitions -->
  <line x1="260" y1="280" x2="260" y2="360" stroke="#334155" stroke-width="4"/>
  <line x1="400" y1="280" x2="400" y2="360" stroke="#334155" stroke-width="4"/>
  <line x1="540" y1="280" x2="540" y2="360" stroke="#334155" stroke-width="4"/>

  <!-- Chairs aligned -->
  <rect x="160" y="400" width="60" height="70" rx="10" fill="#102A43" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="300" y="400" width="60" height="70" rx="10" fill="#102A43" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="440" y="400" width="60" height="70" rx="10" fill="#102A43" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="580" y="400" width="60" height="70" rx="10" fill="#102A43" stroke="#1D4ED8" stroke-width="2"/>

  <!-- Label -->
  <rect x="40" y="40" width="320" height="44" rx="8" fill="#102A43" stroke="#F4B942" stroke-width="1.5"/>
  <text x="56" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Air-Conditioned Reading Hall</text>
</svg>

